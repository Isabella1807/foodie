# Bygger appen og lægger den på GitHub Pages ved hvert push til main
name: deploy to github pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# To jobs, som i GitHubs egen skabelon: i ét job kan deploy-trinnet lede efter
# den byggede side, før GitHub har registreret den ("No artifacts named
# github-pages were found"). Når build er helt færdig, er den der altid.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Nøglerne er "publishable" og ligger alligevel synligt i den byggede app —
      # dataene beskyttes af login + række-sikkerhed i Supabase
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://lencysqdaolqsmbipgqg.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_AqSTErgQ7koIfthnxe4L1Q_hFBn8KZq

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
